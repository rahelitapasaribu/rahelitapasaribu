name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output
        run: |
          rm -rf trophy.svg
          mkdir -p assets
          rm -rf assets/trophy.svg

      - name: Generate Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: rahelitapasaribu
          output_path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: monokai

      - name: Check generated file
        run: |
          ls -lah assets
          file assets/trophy.svg

      - name: Commit Trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub Trophy"
            git push origin HEAD:main
          fi
